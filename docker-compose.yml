services:
  postgresql:
    image: postgres:16
    container_name: postgresql
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: 'app_user'
      POSTGRES_PASSWORD: 'postgresqlPassword'
      POSTGRES_DB: 'app_db'
  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db-store: